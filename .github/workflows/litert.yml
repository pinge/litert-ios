name: 🍏 LiteRT

# LiteRT iOS published as an immutable GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: LiteRT release version, see https://github.com/google-ai-edge/LiteRT/releases
        required: true
        default: "2.1.6" # stable
        type: choice
        options:
          - "2.2.0"
          - "2.1.6"

permissions:
  contents: write

concurrency:
  group: litert-release
  cancel-in-progress: false

env:
  LITERT_VERSION: ${{ inputs.version }}
  LITERT_REPOSITORY: https://github.com/google-ai-edge/LiteRT.git
  XCODE_VERSION: "26.1.1"

jobs:
  build-release:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      LITERT_SOURCE_DIR: ${{ github.workspace }}/.build/litert-${{ inputs.version }}-source
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: LiteRT Version
        run: |
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "LiteRT releases must run from a branch" >&2
            exit 1
          fi

      - name: Check Release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${LITERT_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip Release
        if: steps.check.outputs.exists == 'true'
        run: echo "Release v${LITERT_VERSION} already exists."

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.check.outputs.exists != 'true'

      - name: Xcode Select
        if: steps.check.outputs.exists != 'true'
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcode-select -p

      - name: Toolchain Versions
        if: steps.check.outputs.exists != 'true'
        run: |
          XCODE_VERSION="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          echo "XCODE_VERSION=$XCODE_VERSION" >> "$GITHUB_ENV"
          xcrun --show-sdk-path --sdk iphoneos

      - name: Checkout LiteRT
        if: steps.check.outputs.exists != 'true'
        env:
          # Defers Git LFS downloads. 2.1.6 pulls only the required Metal dylibs and 2.2.0 needs none.
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          mkdir -p .build
          test ! -e "$LITERT_SOURCE_DIR"
          git clone \
            --branch "v${LITERT_VERSION}" \
            --depth 1 \
            --filter=blob:none \
            "${LITERT_REPOSITORY}" \
            "$LITERT_SOURCE_DIR"
          cd "$LITERT_SOURCE_DIR"
          test "$(git describe --tags --exact-match HEAD)" = "v${LITERT_VERSION}"
          LITERT_COMMIT="$(git rev-parse HEAD)"
          echo "LITERT_COMMIT=$LITERT_COMMIT" >> "$GITHUB_ENV"

      - name: Build LiteRT
        if: steps.check.outputs.exists != 'true'
        run: "${GITHUB_WORKSPACE}/ci/${LITERT_VERSION}/build-litert-${LITERT_VERSION}.sh"

      # GitHub MacOs hosted runners do not have access to a physical GPU, so the testMetalBuffer always fails.
      # Note: this does not test the built LiteRT in the previous step. This just a source code + environment sanity check.
      - name: Test LiteRT Swift API
        if: steps.check.outputs.exists != 'true'
        run: |
          cd "$LITERT_SOURCE_DIR"
          TEST_FILE=litert/swift/Tests/TensorBufferTests.swift
          test "$(grep -c '^  func testMetalBuffer() throws {$' "$TEST_FILE")" -eq 1
          sed -i '' \
            's/^  func testMetalBuffer() throws {$/  func disabledTestMetalBuffer() throws {/' \
            "$TEST_FILE"
          grep -q '^  func disabledTestMetalBuffer() throws {$' "$TEST_FILE"
          bazel test -c opt --test_output=all //litert/swift:LiteRT_Swift_Tests

      - name: Package XCFrameworks
        if: steps.check.outputs.exists != 'true'
        run: "${GITHUB_WORKSPACE}/ci/${LITERT_VERSION}/package-litert-xcframeworks-${LITERT_VERSION}.sh"

      - name: Validate XCFrameworks
        if: steps.check.outputs.exists != 'true'
        run: |
          "${GITHUB_WORKSPACE}/ci/${LITERT_VERSION}/validate-litert-xcframeworks-${LITERT_VERSION}.sh" "$ARTIFACT_DIR"

      - name: Release Checksums
        if: steps.check.outputs.exists != 'true'
        run: |
          cd "$ARTIFACT_DIR"
          CLITERT_CHECKSUM="$(shasum -a 256 CLiteRT.xcframework.zip | awk '{ print $1 }')"
          METAL_CHECKSUM="$(shasum -a 256 LiteRTMetalAccelerator.xcframework.zip | awk '{ print $1 }')"
          COCOAPODS_CHECKSUM="$(shasum -a 256 LiteRT.xcframeworks.zip | awk '{ print $1 }')"
          printf '%s  %s\n' \
            "$CLITERT_CHECKSUM" CLiteRT.xcframework.zip \
            "$METAL_CHECKSUM" LiteRTMetalAccelerator.xcframework.zip \
            "$COCOAPODS_CHECKSUM" LiteRT.xcframeworks.zip | tee SHA256SUMS
          echo "CLITERT_CHECKSUM=$CLITERT_CHECKSUM" >> "$GITHUB_ENV"
          echo "METAL_CHECKSUM=$METAL_CHECKSUM" >> "$GITHUB_ENV"
          echo "COCOAPODS_CHECKSUM=$COCOAPODS_CHECKSUM" >> "$GITHUB_ENV"
          MACOS_VERSION="$(sw_vers -productVersion)"
          RUNNER_ARCHITECTURE="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          cat > "LiteRT-v${LITERT_VERSION}.json" <<EOF
          {
            "litert_version": "${LITERT_VERSION}",
            "litert_repository": "${LITERT_REPOSITORY}",
            "litert_commit": "${LITERT_COMMIT}",
            "litert_metal_commit": "${LITERT_METAL_COMMIT:-${LITERT_COMMIT}}",
            "bazel": "${BAZEL_VERSION}",
            "xcode": "${XCODE_VERSION}",
            "runner": "${ImageOS}-${RUNNER_ARCHITECTURE}-${ImageVersion}",
            "macos": "${MACOS_VERSION}",
            "artifacts": [
              "CLiteRT.xcframework.zip",
              "LiteRTMetalAccelerator.xcframework.zip",
              "LiteRT.xcframeworks.zip"
            ]
          }
          EOF
          cat "LiteRT-v${LITERT_VERSION}.json"

      - name: LiteRT.podspec
        if: steps.check.outputs.exists != 'true'
        run: |
          cat > LiteRT.podspec <<EOF
          Pod::Spec.new do |spec|
            spec.name = 'LiteRT'
            spec.version = '${LITERT_VERSION}'
            spec.authors = 'Google Inc.'
            spec.license = { :type => 'Apache-2.0', :file => 'LICENSE' }
            spec.homepage = 'https://github.com/google-ai-edge/LiteRT'
            spec.source = {
              :http => "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{spec.version}/LiteRT.xcframeworks.zip",
              :sha256 => '${COCOAPODS_CHECKSUM}'
            }
            spec.summary = 'LiteRT runtime and Metal accelerator for iOS.'
            spec.cocoapods_version = '>= 1.9.0'
            spec.ios.deployment_target = '15.0'
            spec.vendored_frameworks = [
              'CLiteRT.xcframework',
              'LiteRTMetalAccelerator.xcframework'
            ]
          end
          EOF
          pod ipc spec LiteRT.podspec >/dev/null

      - name: Package.swift
        if: steps.check.outputs.exists != 'true'
        run: |
          cat > Package.swift <<EOF
          // swift-tools-version: 5.9

          import PackageDescription

          let release = "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${LITERT_VERSION}"

          let package = Package(
            name: "LiteRT",
            platforms: [
              .iOS(.v15),
            ],
            products: [
              .library(
                name: "LiteRT",
                targets: [
                  "CLiteRT",
                  "LiteRTMetalAccelerator",
                ]
              ),
            ],
            targets: [
              .binaryTarget(
                name: "CLiteRT",
                url: "\(release)/CLiteRT.xcframework.zip",
                checksum: "${CLITERT_CHECKSUM}"
              ),
              .binaryTarget(
                name: "LiteRTMetalAccelerator",
                url: "\(release)/LiteRTMetalAccelerator.xcframework.zip",
                checksum: "${METAL_CHECKSUM}"
              ),
            ]
          )
          EOF
          swift package dump-package >/dev/null

      - name: Commit Manifests
        if: steps.check.outputs.exists != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          EXPECTED_HEAD="$(git rev-parse HEAD)"
          git add LiteRT.podspec Package.swift

          if git diff --cached --quiet -- LiteRT.podspec Package.swift; then
            echo "PACKAGE_COMMIT=$EXPECTED_HEAD" >> "$GITHUB_ENV"
            exit 0
          fi

          git diff --cached --check -- LiteRT.podspec Package.swift
          PODSPEC_CONTENT="$(base64 < LiteRT.podspec | tr -d '\n')"
          PACKAGE_CONTENT="$(base64 < Package.swift | tr -d '\n')"
          QUERY='mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid signature { isValid wasSignedByGitHub } } } }'
          REQUEST="$(
            jq -n \
              --arg query "$QUERY" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg branch "$GITHUB_REF_NAME" \
              --arg head "$EXPECTED_HEAD" \
              --arg message "build: LiteRT v${LITERT_VERSION}" \
              --arg podspec "$PODSPEC_CONTENT" \
              --arg package "$PACKAGE_CONTENT" \
              '{
                query: $query,
                variables: {
                  input: {
                    branch: {
                      repositoryNameWithOwner: $repository,
                      branchName: $branch
                    },
                    expectedHeadOid: $head,
                    message: {
                      headline: $message
                    },
                    fileChanges: {
                      additions: [
                        {
                          path: "LiteRT.podspec",
                          contents: $podspec
                        },
                        {
                          path: "Package.swift",
                          contents: $package
                        }
                      ]
                    }
                  }
                }
              }'
          )"
          RESPONSE="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --request POST \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "$REQUEST" \
              https://api.github.com/graphql
          )"

          if ! PACKAGE_COMMIT="$(jq -er '.data.createCommitOnBranch.commit.oid' <<< "$RESPONSE")"; then
            jq . <<< "$RESPONSE" >&2
            exit 1
          fi
          if ! jq -e \
            '.data.createCommitOnBranch.commit.signature | .isValid == true and .wasSignedByGitHub == true' \
            <<< "$RESPONSE" >/dev/null; then
            echo "GitHub did not return a valid signed commit" >&2
            jq . <<< "$RESPONSE" >&2
            exit 1
          fi

          echo "PACKAGE_COMMIT=$PACKAGE_COMMIT" >> "$GITHUB_ENV"

      - name: GitHub Release
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$ARTIFACT_DIR"
          shasum -a 256 -c SHA256SUMS
          gh release create "v${LITERT_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "$PACKAGE_COMMIT" \
            --title "LiteRT v${LITERT_VERSION} for iOS" \
            --notes "📚 LiteRT v${LITERT_VERSION} for iOS"$'\n'"📦️ Built from ${LITERT_REPOSITORY%.git}/releases/tag/v${LITERT_VERSION}"$'\n'"📝 See LiteRT-v${LITERT_VERSION}.json and verify with SHA256SUMS" \
            CLiteRT.xcframework.zip \
            LiteRTMetalAccelerator.xcframework.zip \
            LiteRT.xcframeworks.zip \
            "LiteRT-v${LITERT_VERSION}.json" \
            SHA256SUMS
