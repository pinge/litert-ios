name: 🍏 LiteRT

on:
  workflow_dispatch:
    inputs:
      version:
        description: LiteRT release version, see https://github.com/google-ai-edge/LiteRT/releases
        required: true
        default: "2.1.6" # stable
        type: choice
        options:
          - "2.2.0"
          - "2.1.6"

permissions:
  contents: read

concurrency:
  group: litert-release
  cancel-in-progress: false

jobs:
  preflight:
    name: 🛫 Preflight
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.release.outputs.result }}
    steps:
      - name: Release Branch
        run: |
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "LiteRT releases must run from a branch" >&2
            exit 1
          fi

      - name: Check Release
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: v${{ inputs.version }}
        with:
          result-encoding: string
          retries: 3
          script: |
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: process.env.TAG })
              core.info(`Release ${process.env.TAG} already exists.`)
              return "false"
            } catch (error) {
              if (error.status === 404) {
                return "true"
              }
              throw error
            }

  build:
    name: 📖
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version }}

  simulator:
    name: 🖥️
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/simulator-integration-tests.yml
    with:
      version: ${{ inputs.version }}
      artifact_name: litert-v${{ inputs.version }}

  device:
    name: 📱
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/device-integration-tests.yml
    with:
      version: ${{ inputs.version }}
      artifact_name: litert-v${{ inputs.version }}
    # https://github.com/actions/runner/issues/4453
    secrets: inherit

  release:
    name: 🏷️
    needs:
      - build
      - simulator
      - device
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ inputs.version }}
      artifact_name: litert-v${{ inputs.version }}
