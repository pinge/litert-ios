name: 🍏 LiteRT

# LiteRT iOS published as an immutable GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: LiteRT release version, see https://github.com/google-ai-edge/LiteRT/releases
        required: true
        default: "2.1.6" # stable
        type: choice
        options:
          - "2.2.0"
          - "2.1.6"

permissions:
  contents: write

concurrency:
  group: litert-release
  cancel-in-progress: false

env:
  LITERT_VERSION: ${{ inputs.version }}
  LITERT_REPOSITORY: https://github.com/google-ai-edge/LiteRT.git
  XCODE_VERSION: "26.1.1"

jobs:
  build-release:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      LITERT_SOURCE_DIR: ${{ github.workspace }}/.build/litert-${{ inputs.version }}-source
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: LiteRT Version
        run: |
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "LiteRT releases must run from a branch" >&2
            exit 1
          fi
          if [[ ! "$LITERT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "LiteRT has no $LITERT_VERSION version" >&2
            exit 1
          fi

      - name: Check Release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${LITERT_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip Release
        if: steps.check.outputs.exists == 'true'
        run: echo "Release v${LITERT_VERSION} already exists."

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.check.outputs.exists != 'true'

      - name: Xcode Select
        if: steps.check.outputs.exists != 'true'
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcode-select -p

      - name: Toolchain Versions
        if: steps.check.outputs.exists != 'true'
        run: |
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphoneos

      - name: Checkout LiteRT
        if: steps.check.outputs.exists != 'true'
        env:
          # Defers Git LFS downloads. 2.1.6 pulls only the required Metal dylibs and 2.2.0 needs none.
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          mkdir -p .build
          test ! -e "$LITERT_SOURCE_DIR"
          git clone \
            --branch "v${LITERT_VERSION}" \
            --depth 1 \
            --filter=blob:none \
            "${LITERT_REPOSITORY}" \
            "$LITERT_SOURCE_DIR"
          cd "$LITERT_SOURCE_DIR"
          test "$(git describe --tags --exact-match HEAD)" = "v${LITERT_VERSION}"
          LITERT_COMMIT="$(git rev-parse HEAD)"
          echo "LITERT_COMMIT=$LITERT_COMMIT" >> "$GITHUB_ENV"

      - name: Build LiteRT
        if: steps.check.outputs.exists != 'true'
        run: "${GITHUB_WORKSPACE}/scripts/litert/${LITERT_VERSION}/build-litert-${LITERT_VERSION}.sh"

      # GitHub MacOs hosted runners do not have access to a physical GPU, so the testMetalBuffer always fails.
      # Note: this does not test the built LiteRT in the previous step. This just a source code + environment sanity check.
      - name: Test LiteRT Swift API
        if: steps.check.outputs.exists != 'true'
        run: |
          cd "$LITERT_SOURCE_DIR"
          TEST_FILE=litert/swift/Tests/TensorBufferTests.swift
          test "$(grep -c '^  func testMetalBuffer() throws {$' "$TEST_FILE")" -eq 1
          sed -i '' \
            's/^  func testMetalBuffer() throws {$/  func disabledTestMetalBuffer() throws {/' \
            "$TEST_FILE"
          grep -q '^  func disabledTestMetalBuffer() throws {$' "$TEST_FILE"
          time bazel test -c opt --test_output=all //litert/swift:LiteRT_Swift_Tests

      - name: Package XCFrameworks
        if: steps.check.outputs.exists != 'true'
        run: "${GITHUB_WORKSPACE}/scripts/litert/${LITERT_VERSION}/package-litert-xcframeworks-${LITERT_VERSION}.sh"

      - name: Validate XCFrameworks
        if: steps.check.outputs.exists != 'true'
        run: |
          "${GITHUB_WORKSPACE}/scripts/litert/${LITERT_VERSION}/validate-litert-xcframeworks-${LITERT_VERSION}.sh" "$ARTIFACT_DIR"

      - name: Release Checksums
        if: steps.check.outputs.exists != 'true'
        run: |
          cd "$ARTIFACT_DIR"
          CLITERT_CHECKSUM="$(shasum -a 256 CLiteRT.xcframework.zip | awk '{ print $1 }')"
          METAL_CHECKSUM="$(shasum -a 256 LiteRTMetalAccelerator.xcframework.zip | awk '{ print $1 }')"
          printf '%s  %s\n' \
            "$CLITERT_CHECKSUM" CLiteRT.xcframework.zip \
            "$METAL_CHECKSUM" LiteRTMetalAccelerator.xcframework.zip | tee SHA256SUMS
          echo "CLITERT_CHECKSUM=$CLITERT_CHECKSUM" >> "$GITHUB_ENV"
          echo "METAL_CHECKSUM=$METAL_CHECKSUM" >> "$GITHUB_ENV"
          du -sh "$LITERT_SOURCE_DIR" "$ARTIFACT_DIR"
          cat > "LiteRT-v${LITERT_VERSION}.json" <<EOF
          {
            "litert_version": "${LITERT_VERSION}",
            "litert_repository": "${LITERT_REPOSITORY}",
            "litert_commit": "${LITERT_COMMIT}",
            "litert_metal_commit": "${LITERT_METAL_COMMIT:-${LITERT_COMMIT}}",
            "bazel": "${BAZEL_VERSION}",
            "xcode": "$(xcodebuild -version | tr '\n' ' ')",
            "runner": "${RUNNER_OS} ${RUNNER_ARCH}",
            "artifacts": [
              "CLiteRT.xcframework.zip",
              "LiteRTMetalAccelerator.xcframework.zip"
            ]
          }
          EOF
          cat "LiteRT-v${LITERT_VERSION}.json"

      - name: Swift Package Manifest
        if: steps.check.outputs.exists != 'true'
        run: |
          cat > Package.swift <<EOF
          // swift-tools-version: 5.9

          import PackageDescription

          let release = "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${LITERT_VERSION}"

          let package = Package(
            name: "LiteRT",
            platforms: [
              .iOS(.v15),
            ],
            products: [
              .library(
                name: "LiteRT",
                targets: [
                  "CLiteRT",
                  "LiteRTMetalAccelerator",
                ]
              ),
            ],
            targets: [
              .binaryTarget(
                name: "CLiteRT",
                url: "\(release)/CLiteRT.xcframework.zip",
                checksum: "${CLITERT_CHECKSUM}"
              ),
              .binaryTarget(
                name: "LiteRTMetalAccelerator",
                url: "\(release)/LiteRTMetalAccelerator.xcframework.zip",
                checksum: "${METAL_CHECKSUM}"
              ),
            ]
          )
          EOF
          swift package dump-package >/dev/null

      - name: Commit Swift Package Manifest
        if: steps.check.outputs.exists != 'true'
        run: |
          if [[ -n "$(git status --porcelain -- Package.swift)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Package.swift
            git diff --cached --check -- Package.swift
            git commit -m "Release LiteRT v${LITERT_VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          PACKAGE_COMMIT="$(git rev-parse HEAD)"
          echo "PACKAGE_COMMIT=$PACKAGE_COMMIT" >> "$GITHUB_ENV"

      - name: GitHub Release
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$ARTIFACT_DIR"
          shasum -a 256 \
            CLiteRT.xcframework.zip \
            LiteRTMetalAccelerator.xcframework.zip
          gh release create "v${LITERT_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "$PACKAGE_COMMIT" \
            --title "LiteRT v${LITERT_VERSION} for iOS" \
            --notes "📚 LiteRT v${LITERT_VERSION} for iOS"$'\n'"📦️ Built from ${LITERT_REPOSITORY%.git}/releases/tag/v${LITERT_VERSION}"$'\n'"📝 See LiteRT-v${LITERT_VERSION}.json and verify with SHA256SUMS" \
            CLiteRT.xcframework.zip \
            LiteRTMetalAccelerator.xcframework.zip \
            "LiteRT-v${LITERT_VERSION}.json" \
            SHA256SUMS
