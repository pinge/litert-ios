name: ⏱️ Device Benchmark Tests

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      artifact_name:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      version:
        description: LiteRT release version
        required: true
        default: "2.2.0"
        type: choice
        options:
          - "2.2.0"
          - "2.1.6"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-device-benchmark-tests-${{ github.ref }}
  cancel-in-progress: true

# AWS Device Farm is available only in us-west-2.
# https://docs.aws.amazon.com/devicefarm/latest/developerguide/getting-started.html
env:
  AWS_REGION: us-west-2
  XCODE_VERSION: "26.6"

jobs:
  mobilenetv2:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 60
    environment: aws-device-farm
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - name: iPhone 17 Pro Max
            device: Apple iPhone 17 Pro Max
            ios_version: "26.3.1"
          - name: iPhone 16
            device: Apple iPhone 16
            ios_version: "26.0"
          - name: iPhone 15 Plus
            device: Apple iPhone 15 Plus
            ios_version: "17.4.1"
          - name: iPhone 14 Pro
            device: Apple iPhone 14 Pro
            ios_version: "27.0"
          - name: iPhone 13
            device: Apple iPhone 13
            ios_version: "18.5"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download LiteRT Artifacts
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/litert-artifacts

      - name: LiteRT Artifact Directory
        if: inputs.artifact_name != ''
        run: echo "LITERT_ARTIFACT_DIR=$RUNNER_TEMP/litert-artifacts" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: AWS Device Farm
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEVICE_FARM_ROLE_ARN }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          output-credentials: false
          unset-current-credentials: true
          translate-env-variables: false

      - name: Benchmark Tests
        env:
          DEVICE_FARM_PROJECT_ARN: ${{ secrets.AWS_DEVICE_FARM_PROJECT_ARN }}
          DEVICE_FARM_DEVICE_NAME: ${{ matrix.device }}
          DEVICE_FARM_OS_VERSION: ${{ matrix.ios_version }}
        run: Tests/test-benchmark.sh "${{ inputs.version }}"
