name: 📱 Device Integration Tests

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      artifact_name:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      version:
        description: LiteRT release version
        required: true
        default: "2.2.0"
        type: choice
        options:
          - "2.2.0"
          - "2.1.6"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-device-integration-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.6"

jobs:
  package-managers:
    name: ${{ matrix.package_manager_name }}
    runs-on: macos-26
    timeout-minutes: 60
    environment: aws-device-farm
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_manager: swiftpm
            package_manager_name: SwiftPM
          - package_manager: cocoapods
            package_manager_name: CocoaPods
    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download LiteRT Artifacts
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/litert-artifacts

      - name: LiteRT Artifact Directory
        if: inputs.artifact_name != ''
        run: echo "LITERT_ARTIFACT_DIR=$RUNNER_TEMP/litert-artifacts" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: AWS Device Farm
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-west-2
          role-to-assume: ${{ secrets.AWS_DEVICE_FARM_ROLE_ARN }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          output-credentials: false
          unset-current-credentials: true
          translate-env-variables: false

      - name: Integration Tests
        env:
          DEVICE_FARM_PROJECT_ARN: ${{ secrets.AWS_DEVICE_FARM_PROJECT_ARN }}
          # Best balance between recent hardware and recent iOS version on AWS Device Farm.
          DEVICE_FARM_DEVICE_NAME: Apple iPhone 17 Pro
          DEVICE_FARM_OS_VERSION: "26.3.1"
        run: Tests/test-integration.sh device "${{ inputs.version }}" "${{ matrix.package_manager }}"

  ios-runtimes:
    name: iOS ${{ matrix.ios_runtime }}
    runs-on: macos-26
    timeout-minutes: 90
    environment: aws-device-farm
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: Apple iPhone SE (2022)
            ios_runtime: "16.4"
          - device: Apple iPhone 12
            ios_runtime: "17.5.1"
          - device: Apple iPhone 16
            ios_runtime: "18.6.2"
          - device: Apple iPhone 12
            ios_runtime: "26.6"
          - device: Apple iPhone 14 Pro
            ios_runtime: "27.0"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download LiteRT Artifacts
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/litert-artifacts

      - name: LiteRT Artifact Directory
        if: inputs.artifact_name != ''
        run: echo "LITERT_ARTIFACT_DIR=$RUNNER_TEMP/litert-artifacts" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: AWS Device Farm
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-west-2
          role-to-assume: ${{ secrets.AWS_DEVICE_FARM_ROLE_ARN }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          output-credentials: false
          unset-current-credentials: true
          translate-env-variables: false

      - name: Integration Tests
        env:
          DEVICE_FARM_PROJECT_ARN: ${{ secrets.AWS_DEVICE_FARM_PROJECT_ARN }}
          DEVICE_FARM_DEVICE_NAME: ${{ matrix.device }}
          DEVICE_FARM_OS_VERSION: ${{ matrix.ios_runtime }}
        run: Tests/test-integration.sh device "${{ inputs.version }}" swiftpm
