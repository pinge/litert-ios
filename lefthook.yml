# Conventional Commits: type(scope): subject
# types: build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test
commit-msg:
  commands:
    conventional-commit:
      run: "grep -Eq '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\\([^()]+\\))?(!)?: [^ ].*' .git/COMMIT_EDITMSG"
